<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — DAMARES GILA</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef3ff;font:15px system-ui}main{max-width:900px;margin:auto;padding:16px}.panel{background:#151d32;border:1px solid #293650;border-radius:13px;padding:16px;margin:12px 0}h1{color:#f4c76b}input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #34415c;background:#0d1528;color:white;margin:5px 0 12px}.btn{padding:10px 13px;border:0;border-radius:8px;background:#6651c8;color:white;font-weight:bold;margin:4px;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.muted{color:#aab6ce;font-size:13px}.item{padding:9px 0;border-bottom:1px solid #293650;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
</style></head><body><main><h1>⚙ DAMARES GILA — ADMIN</h1><section id="login" class="panel"><h3>Login admin</h3><p class="muted">Password admin disimpan sebagai hash di server, bukan di halaman ini.</p><input id="adminUser" placeholder="Username admin" value="admin"><input id="adminPass" type="password" placeholder="Password admin"><button class="btn" onclick="login()">Masuk</button><p id="loginMsg" class="muted"></p></section>
<section id="dash" class="hidden"><div class="panel"><div class="row"><div><h3>Kontrol market bersama</h3><h2 id="currentPrice">—</h2><div id="state" class="muted"></div></div><button class="btn" onclick="load()">Refresh data</button><button class="btn" onclick="logout()">Keluar</button></div>
<label>Atur harga langsung</label><input id="priceInput" type="number" step=".01" placeholder="Harga baru"><button class="btn" onclick="cmd('setPrice')">Terapkan harga</button>
<label>Gerakkan harga</label><div class="row"><input id="moveAmount" type="number" step=".01" value="10"><select id="moveDirection"><option value="up">Naik</option><option value="down">Turun</option></select></div><button class="btn" onclick="cmd('move')">Gerakkan</button><button class="btn" onclick="cmd('spike')">Buat lonjakan</button>
<label>Arah otomatis</label><select id="direction"><option value="sideways">Sideways</option><option value="up">Naik</option><option value="down">Turun</option></select><label>Kecepatan (0–100)</label><input id="speed" type="number" min="0" max="100" step=".1" value="1"><button class="btn" onclick="cmd('direction')">Atur arah</button><button class="btn" onclick="cmd('speed')">Atur kecepatan</button><button class="btn" onclick="cmd('pause')">Jeda / lanjutkan</button><p class="muted">Kontrol ini memengaruhi market yang sama untuk seluruh pemain.</p></div>
<div class="panel"><h3>Daftar pemain</h3><div id="players" class="muted"></div></div><div class="panel"><h3>Permintaan hadiah</h3><div id="redemptions" class="muted"></div></div></section></main>
<script>
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json"},body:opts.body||undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Gagal");return d}
async function login(){try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({username:$("adminUser").value,password:$("adminPass").value})});$("login").classList.add("hidden");$("dash").classList.remove("hidden");load()}catch(e){$("loginMsg").textContent=e.message}}
async function logout(){await api("/api/admin/logout",{method:"POST"});location.reload()}
async function cmd(action){let body={action};if(action==="setPrice")body.value=Number($("priceInput").value);if(action==="move"||action==="spike"){body.value=Number($("moveAmount").value);body.direction=$("moveDirection").value}if(action==="direction")body.direction=$("direction").value;if(action==="speed")body.speed=Number($("speed").value);try{await api("/api/admin/market",{method:"POST",body:JSON.stringify(body)});load()}catch(e){alert(e.message)}}
async function redemption(id,status){try{await api("/api/admin/redemption",{method:"POST",body:JSON.stringify({id,status})});load()}catch(e){alert(e.message)}}
async function load(){try{const d=await api("/api/admin/overview");$("currentPrice").textContent=Number(d.market.price).toFixed(2);$("state").textContent=`Arah ${d.market.direction} · Speed ${d.market.speed}x · ${d.market.paused?"PAUSED":"RUNNING"}`;$("players").innerHTML=d.players.map(p=>`<div class="item"><span>${p.username}<br><small>${p.created_at}</small></span><b>${Number(p.balance).toLocaleString("id-ID")} BRAY</b></div>`).join("")||"Belum ada pemain.";$("redemptions").innerHTML=d.redemptions.map(r=>`<div class="item"><span>#${r.id} ${r.username}<br>${r.reward} · ${r.status}</span><span>${r.status==="PENDING"?`<button class="btn" onclick="redemption(${r.id},'FULFILLED')">Selesai</button><button class="btn" onclick="redemption(${r.id},'REJECTED')">Tolak/refund</button>`:""}</span></div>`).join("")||"Belum ada permintaan."}catch(e){$("loginMsg").textContent=e.message}}
</script></body></html>
